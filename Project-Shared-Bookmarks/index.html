<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Bookmarks</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
    <h1>Shared Bookmarks</h1>
    <!-- User Selector -->
    <div class="two-column">
    <!-- User Selector -->
    <section>
    <label for="user-select">Select User:</label>
    <select id="user-select" aria-label="Select a user to view their bookmarks"></select>
    </section>
    <!-- Add Bookmark Form -->
    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Add New Bookmark</h2>
      <div class="addInput">
        <label for="title">Title:</label>
        <input
          type="text"
          class="form-control"
          id="title"
          name="title"
          required
          aria-required="true"
        />
        <label for="url">Link:</label>
        <input
          type="url"
          class="form-control"
          id="url"
          name="url"
          required
          aria-required="true"
          placeholder="https://example.com"
        />
        <label for="description">Description:</label>
        <input
          type="text"
          class="form-control"
          id="description"
          name="description"
          required
          aria-required="true"
        />
        <button type="button" id="submit-btn" class="btn btn-primary">Submit</button>
      </div>
    </section>
    </div>
    <!-- Bookmark List -->
    <section aria-labelledby="bookmarks-heading">
      <h2 id="bookmarks-heading">Bookmarks</h2>
      <div id="bookmark-list" aria-live="polite"></div>
    </section>
    </main>
    <script type="module" src="script.js"></script>
  </body>
</html>
